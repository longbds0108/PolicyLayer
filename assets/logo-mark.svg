<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="PolicyLayer">
  <defs>
    <linearGradient id="plMarkBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#9B5DE5"/>
      <stop offset="100%" stop-color="#3F91FF"/>
    </linearGradient>
  </defs>
  <!-- Rounded square container: matches the dapp's accent gradient. -->
  <rect x="2" y="2" width="28" height="28" rx="8" fill="url(#plMarkBg)"/>
  <!-- Three stacked layers, decreasing width — the "policy layers" idea, with
       the top rule (active version) full-width and slightly brighter. -->
  <g fill="#ffffff">
    <rect x="7"  y="9"    width="18" height="3" rx="1.5" opacity="0.95"/>
    <rect x="7"  y="14.5" width="13" height="3" rx="1.5" opacity="0.72"/>
    <rect x="7"  y="20"   width="9"  height="3" rx="1.5" opacity="0.52"/>
  </g>
  <!-- Consensus indicator on the active rule (teal = COMPLIANT). -->
  <circle cx="25" cy="10.5" r="1.9" fill="#4FD1C5"/>
</svg>
