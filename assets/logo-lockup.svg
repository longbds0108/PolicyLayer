<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 48" role="img" aria-label="PolicyLayer">
  <defs>
    <linearGradient id="plLockupBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#9B5DE5"/>
      <stop offset="100%" stop-color="#3F91FF"/>
    </linearGradient>
  </defs>
  <!-- Mark, sized to match wordmark cap height. -->
  <g transform="translate(4,8)">
    <rect x="0" y="0" width="32" height="32" rx="8" fill="url(#plLockupBg)"/>
    <g fill="#ffffff">
      <rect x="5"  y="7"    width="18" height="3" rx="1.5" opacity="0.95"/>
      <rect x="5"  y="12.5" width="13" height="3" rx="1.5" opacity="0.72"/>
      <rect x="5"  y="18"   width="9"  height="3" rx="1.5" opacity="0.52"/>
    </g>
    <circle cx="23" cy="8.5" r="1.9" fill="#4FD1C5"/>
  </g>
  <!-- Wordmark. Uses system serif so it reads consistently even where the
       Fraunces webfont is not loaded. -->
  <text x="48" y="32"
        font-family="Fraunces, 'Times New Roman', Georgia, serif"
        font-size="24" font-weight="600"
        letter-spacing="-0.5"
        fill="#F4F2F7">Policy<tspan fill="#B57DEE">Layer</tspan></text>
</svg>
